<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>太空射击 Space Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
body{background:#000;display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100vw;height:100vh;max-width:420px;max-height:780px;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;padding:16px 20px;display:flex;justify-content:space-between;z-index:10}
.panel{background:rgba(0,0,0,0.6);border:1px solid rgba(0,245,255,0.2);border-radius:8px;padding:6px 14px;text-align:center}
.panel .label{font-size:9px;color:#00f5ff;text-transform:uppercase;letter-spacing:1px}
.panel .value{font-size:18px;font-weight:700;color:#fff}
#hp-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:160px;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;z-index:10;overflow:hidden}
#hp-fill{width:100%;height:100%;background:linear-gradient(90deg,#00f5ff,#7bed9f);border-radius:4px;transition:width 0.3s}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.85);z-index:30}
.overlay.show{display:flex}
.overlay h2{font-size:36px;color:#00f5ff;margin-bottom:10px;text-shadow:0 0 20px rgba(0,245,255,0.5)}
.overlay .sc{font-size:48px;color:#fff;font-weight:800;margin-bottom:5px}
.overlay p{color:rgba(255,255,255,0.5);margin-bottom:25px}
.overlay button{padding:14px 50px;font-size:18px;color:#000;background:linear-gradient(135deg,#00f5ff,#7bed9f);border:none;border-radius:30px;cursor:pointer;font-weight:700}
.overlay button:active{transform:scale(0.95)}
.dpad{position:absolute;bottom:30px;left:20px;display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px;z-index:15}
.dpad .b{background:rgba(0,245,255,0.1);border:1px solid rgba(0,245,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(0,255,255,0.5);cursor:pointer}
.dpad .b:active{background:rgba(0,245,255,0.3)}
.dpad .b.e{background:transparent;border:none}
.fire-btn{position:absolute;bottom:50px;right:30px;width:70px;height:70px;border-radius:50%;background:rgba(255,107,107,0.2);border:2px solid rgba(255,107,107,0.4);display:flex;align-items:center;justify-content:center;font-size:24px;color:#ff6b6b;cursor:pointer;z-index:15}
.fire-btn:active{background:rgba(255,107,107,0.5)}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div id="ui">
<div class="panel"><div class="label">分数</div><div class="value" id="score">0</div></div>
<div class="panel"><div class="label">波次</div><div class="value" id="wave">1</div></div>
<div class="panel"><div class="label">最高</div><div class="value" id="best">0</div></div>
</div>
<div id="hp-bar"><div id="hp-fill"></div></div>
<div class="dpad">
<div class="b e"></div><div class="b" id="upBtn">▲</div><div class="b e"></div>
<div class="b" id="leftBtn">◀</div><div class="b e"></div><div class="b" id="rightBtn">▶</div>
<div class="b e"></div><div class="b" id="downBtn">▼</div><div class="b e"></div>
</div>
<div class="fire-btn" id="fireBtn">🔥</div>
<div class="overlay" id="startScreen"><h2>🚀 太空射击</h2><p>SPACE SHOOTER — 消灭入侵者!</p><button id="startBtn">开始游戏</button></div>
<div class="overlay" id="overScreen"><h2>💥 游戏结束</h2><div class="sc" id="finalScore">0</div><p>波次: <span id="finalWave">1</span></p><button id="restartBtn">再来一次</button></div>
</div>

<script>
(function(){
"use strict";

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const app=document.getElementById("app");

let W,H;
let player,bullets=[],enemies=[],enemyBullets=[],particles=[],powerups=[];
let score=0,wave=1,best=parseInt(localStorage.getItem("shooterBest")||"0");
let state="menu",fireTimer=0,fireRate=150;
let hp=100,maxHp=100;
let stars=[];
let enemySpawnTimer=0,enemiesPerWave=8;
let keys={};
let autoFire=true;

function resize(){
  const rect=app.getBoundingClientRect();
  W=rect.width;H=rect.height;
  canvas.width=W;canvas.height=H;
}

function init(){
  resize();score=0;wave=1;hp=maxHp;fireTimer=0;
  player={x:W/2,y:H-100,w:36,h:36,speed:5};
  bullets=[];enemies=[];enemyBullets=[];particles=[];powerups=[];
  enemySpawnTimer=0;enemiesPerWave=8;
  stars=[];
  for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5,sp:Math.random()*1+0.5});
  updateUI();state="playing";
}

function spawnEnemy(){
  const types=[
    {hp:1,speed:2,size:20,color:"#ff6b6b",pts:10},
    {hp:2,speed:1.5,size:24,color:"#ff9f43",pts:20},
    {hp:3,speed:1,size:28,color:"#feca57",pts:30}
  ];
  const t=types[Math.floor(Math.random()*Math.min(types.length,wave))];
  enemies.push({x:Math.random()*(W-60)+30,y:-30,...t,maxHp:t.hp,shootTimer:Math.random()*2000+1000});
}

function addParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,decay:Math.random()*0.03+0.02,size:Math.random()*3+1,color});
  }
}

function update(dt){
  if(state!=="playing")return;
  const spd=player.speed;
  if(keys.ArrowLeft||keys.KeyA)player.x-=spd;
  if(keys.ArrowRight||keys.KeyD)player.x+=spd;
  if(keys.ArrowUp||keys.KeyW)player.y-=spd;
  if(keys.ArrowDown||keys.KeyS)player.y+=spd;
  player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));
  player.y=Math.max(player.w/2,Math.min(H-player.w/2,player.y));
  fireTimer+=dt;
  if(autoFire&&fireTimer>=fireRate){
    fireTimer=0;
    bullets.push({x:player.x,y:player.y-player.h/2,vy:-8,w:4,h:12,color:"#00f5ff"});
  }
  for(let i=bullets.length-1;i>=0;i--){
    bullets[i].y+=bullets[i].vy;
    if(bullets[i].y<-10)bullets.splice(i,1);
  }
  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];
    b.x+=b.vx;b.y+=b.vy;
    if(b.y>H+10||b.y<-10||b.x<-10||b.x>W+10){enemyBullets.splice(i,1);continue;}
    if(Math.abs(b.x-player.x)<player.w/2+b.w&&Math.abs(b.y-player.y)<player.h/2+b.h){
      hp-=10;enemyBullets.splice(i,1);
      addParticles(player.x,player.y,"#ff6b6b",8);
      if(hp<=0){die();return;}
      updateUI();
    }
  }
  enemySpawnTimer+=dt;
  if(enemySpawnTimer>1500&&enemies.length<enemiesPerWave){enemySpawnTimer=0;spawnEnemy();}
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.y+=e.speed;
    e.shootTimer-=dt;
    if(e.shootTimer<=0){
      e.shootTimer=2000+Math.random()*2000;
      const dx=player.x-e.x,dy=player.y-e.y;
      const len=Math.sqrt(dx*dx+dy*dy)||1;
      enemyBullets.push({x:e.x,y:e.y+e.size,vx:dx/len*3,vy:dy/len*3,w:5,h:5,color:"#ff6b6b"});
    }
    if(e.y>H+40){enemies.splice(i,1);continue;}
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(Math.abs(b.x-e.x)<e.size+b.w&&Math.abs(b.y-e.y)<e.size+b.h){
        e.hp--;bullets.splice(j,1);
        addParticles(b.x,b.y,"#fff",4);
        if(e.hp<=0){
          score+=e.pts;addParticles(e.x,e.y,e.color,15);
          if(Math.random()<0.15)powerups.push({x:e.x,y:e.y,type:Math.random()<0.5?"heal":"speed",life:300});
          enemies.splice(i,1);
        }
        break;
      }
    }
  }
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.y+=1.5;p.life--;
    if(p.life<=0||p.y>H+20){powerups.splice(i,1);continue;}
    if(Math.abs(p.x-player.x)<player.w/2+12&&Math.abs(p.y-player.y)<player.h/2+12){
      if(p.type==="heal"){hp=Math.min(maxHp,hp+30);addParticles(p.x,p.y,"#7bed9f",10);}
      else{fireRate=Math.max(60,fireRate-20);addParticles(p.x,p.y,"#ffd700",10);}
      powerups.splice(i,1);updateUI();
    }
  }
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=p.decay;return p.life>0;});
  if(enemies.length===0&&enemies.length===0&&wave*enemiesPerWave<=score/10){
    wave++;enemiesPerWave=8+wave*2;enemySpawnTimer=0;updateUI();
  }
}

function die(){
  state="dead";
  addParticles(player.x,player.y,"#00f5ff",30);
  if(score>best){best=score;localStorage.setItem("shooterBest",best);}
  document.getElementById("finalScore").textContent=score;
  document.getElementById("finalWave").textContent=wave;
  setTimeout(()=>document.getElementById("overScreen").classList.add("show"),500);
}

function updateUI(){
  document.getElementById("score").textContent=score;
  document.getElementById("wave").textContent=wave;
  document.getElementById("hp-fill").style.width=(hp/maxHp*100)+"%";
}

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.15)";ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.y+=s.sp;if(s.y>H){s.y=0;s.x=Math.random()*W;}ctx.fillStyle=`rgba(255,255,255,${0.3+s.s*0.2})`;ctx.fillRect(s.x,s.y,s.s,s.s);});
  if(state==="playing"||state==="dead"){
    if(state!=="dead"){
      ctx.save();ctx.translate(player.x,player.y);
      ctx.fillStyle="#00f5ff";ctx.beginPath();
      ctx.moveTo(0,-player.h/2);ctx.lineTo(-player.w/2,player.h/2);ctx.lineTo(player.w/4,player.h/4);ctx.lineTo(player.w/2,player.h/2);ctx.closePath();ctx.fill();
      ctx.fillStyle="rgba(0,245,255,0.3)";ctx.beginPath();ctx.moveTo(0,-player.h/2+5);ctx.lineTo(-5,player.h/3);ctx.lineTo(5,player.h/3);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle="#00f5ff";
    bullets.forEach(b=>{ctx.shadowColor="#00f5ff";ctx.shadowBlur=8;ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);});
    ctx.shadowBlur=0;
    enemies.forEach(e=>{
      ctx.fillStyle=e.color;ctx.beginPath();
      ctx.moveTo(e.x,e.y-e.size);ctx.lineTo(e.x-e.size,e.y+e.size*0.6);ctx.lineTo(e.x+e.size,e.y+e.size*0.6);ctx.closePath();ctx.fill();
      ctx.fillStyle="rgba(255,255,255,0.2)";ctx.beginPath();ctx.arc(e.x,e.y-e.size*0.2,e.size*0.3,0,Math.PI*2);ctx.fill();
      if(e.hp<e.maxHp){ctx.fillStyle="rgba(255,0,0,0.6)";ctx.fillRect(e.x-e.size,e.y-e.size-8,e.size*2*(e.hp/e.maxHp),3);}
    });
    ctx.fillStyle="#ff6b6b";
    enemyBullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.w,0,Math.PI*2);ctx.fill();});
    powerups.forEach(p=>{
      const pulse=Math.sin(Date.now()*0.01)*3;
      ctx.fillStyle=p.type==="heal"?"#7bed9f":"#ffd700";
      ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10+pulse;
      ctx.beginPath();ctx.arc(p.x,p.y,8+pulse,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle="#fff";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(p.type==="heal"?"♥":"⚡",p.x,p.y);
    });
    particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();});
    ctx.globalAlpha=1;
  }
}

let lastTime=0;
function loop(time){
  const dt=time-lastTime;lastTime=time;
  update(dt);draw();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="Space")e.preventDefault();});
document.addEventListener("keyup",e=>{keys[e.code]=false;});
document.addEventListener("touchstart",e=>{
  const t=e.touches[0];const rect=app.getBoundingClientRect();
  const x=t.clientX-rect.left,y=t.clientY-rect.top;
  if(x<W/2){if(y<H/2)keys.ArrowUp=true;else keys.ArrowDown=true;}
  else{if(y<H/2)keys.KeyW=true;else keys.KeyS=true;}
},{passive:true});

document.getElementById("leftBtn").addEventListener("mousedown",()=>keys.ArrowLeft=true);
document.getElementById("leftBtn").addEventListener("mouseup",()=>keys.ArrowLeft=false);
document.getElementById("rightBtn").addEventListener("mousedown",()=>keys.ArrowRight=true);
document.getElementById("rightBtn").addEventListener("mouseup",()=>keys.ArrowRight=false);
document.getElementById("upBtn").addEventListener("mousedown",()=>keys.ArrowUp=true);
document.getElementById("upBtn").addEventListener("mouseup",()=>keys.ArrowUp=false);
document.getElementById("downBtn").addEventListener("mousedown",()=>keys.ArrowDown=true);
document.getElementById("downBtn").addEventListener("mouseup",()=>keys.ArrowDown=false);

document.getElementById("startBtn").addEventListener("click",()=>{document.getElementById("startScreen").classList.remove("show");init();});
document.getElementById("restartBtn").addEventListener("click",()=>{document.getElementById("overScreen").classList.remove("show");init();});

document.getElementById("best").textContent=best;
resize();window.addEventListener("resize",resize);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
